name: Build Docker and Deploy to Azure VM

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step A: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: DockerHub Login
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step C: Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-auto-build:latest

      # Step D: Azure VM par SSH karke Deployment Commands Chalana
      - name: Executing Remote SSH Commands on Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # Purana running container stop aur remove karo (Agar exist karta hai)
            docker stop web-app || true
            docker rm web-app || true

            # DockerHub se fresh image pull karo
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/docker-auto-build:latest

            # Naya container launch karo Port 80 par
            docker run -d --name web-app -p 80:80 --restart always ${{ secrets.DOCKERHUB_USERNAME }}/docker-auto-build:latest

            # Unused images ko clean karo
            docker image prune -f